<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HiepMovie</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="logo">HIEPMOVIE</div>


    <div class="login-box">
      <h1>Sign In</h1>
      <form action="#">
        <input type="text" placeholder="Email" id="email" />
        <input type="password" placeholder="Mật khẩu" id="password" />
        <button type="submit">
          Sign In
        </button>
          <button type="submit" id="google">
          Sign in with Google
        </button>
      </form>

      <div class="signup">

        New to HiepMovie?
        <a href="./register.html">Sign Up Now</a>
      </div>

      <div class="signup">
        <a href="./forgot.html">Forgot Password</a>
      </div>
      <div class="signup">
        This page is protected by Hiep to ensure you're not a bot.
        <a href="#">Learn More</a>
      </div>
      <button id="landing">
      <a href="./view.html">landing page</a>
    </button>

    </div>
    <!-- Firebase cdn -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"

    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js"
      integrity="sha512-l/ieVoEShBQI9lKOdMY4AAV9rzEE5YHKF8XB4m3Qn3DtK9AhYSOgyDWrL2XH1lhKS4Fde+PNoDiBoT7UhcP23A=="
      crossorigin="anonymous"

    <script

      referrerpolicy="no-referrer"
    ></script>

    <!-- Javascript connection -->
    <script src="./js/firebase-config.js"></script>
