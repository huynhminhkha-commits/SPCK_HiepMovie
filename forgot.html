<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HiepMovie - Đăng nhập</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="logo">HIEPMOVIE</div>

    <div class="login-box">
      <h1>Forgot Password</h1>
      <form>
      <input type="text" placeholder="Email" id="email" />
      <input type="password" placeholder="Mật khẩu" id="password" />
      <input
        type="password"
        placeholder="Xác nhận mật khẩu"
        id="ConfirmPassword"
      />
      <button type="submit">Change Password</button>
      </form>
      <div class="signup">
        Already have an account?
        <a href="./login.html">Sign In</a>
      </div>

      <div class="signup">
        New to HiepMovie?
        <a href="./register.html">Sign Up Now</a>
      </div>
      <div class="signup">
        This page is protected by Hiep to ensure you're not a bot.
        <a href="#">Learn More</a>
      </div>
    </div>
    <script src="./js/forgot.js"></script>
  </body>
</html>
