<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HiepMovie - Cài đặt</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/Setting.css">
  </head>
  <body>
    <header>
      <div class="logo"><a href="./index.html">HIEPMOVIE</a></div>
      <nav>
        <a href="./index.html">Home</a>
        <a href="./Movie.html">Movie</a>
        <a href="./Setting.html">Setting</a>
        <a href="./My_list.html">My list</a>
      </nav>
    </header>

    <section class="page-title">
      <h1>Cài đặt</h1>
    </section>

    <section class="settings">
      <div class="setting-card">
        <h2>Hồ sơ</h2>
        <div class="setting-item">
          <span>Ngôn ngữ</span>
          <select>
            <option>Tiếng Việt</option>
            <option>English</option>
          </select>
        </div>

        <div class="setting-item">
          <span>Chất lượng phát</span>
          <select>
            <option>Tự động</option>
            <option>Thấp</option>
            <option>Trung bình</option>
            <option>Cao</option>
          </select>
        </div>
      </div>

      <div class="setting-card">
        <h2>Quyền riêng tư</h2>
        <div class="setting-item">
          <span>Hiển thị lịch sử xem</span>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <span>Nhận gợi ý cá nhân hóa</span>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="setting-card">
        <h2>Tài khoản</h2>
        <div class="setting-item">
          <span>Đổi mật khẩu</span>
          <button class="danger-btn">
            <a href="./forgot.html">Thay đổi</a>
          </button>
        </div>

        <div class="setting-item">
          <span>Đăng xuất khỏi tất cả thiết bị</span>
          <button class="danger-btn">
            <a href="./login.html">Đăng xuất</a>
          </button>
        </div>
      </div>
    </section>

    <footer>© 2026 HiepMovie.</footer>
  </body>
</html>
